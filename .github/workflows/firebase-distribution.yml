name: Expo Firebase Distribution

on:
    push:
        branches:
            - develop
            - feature/**
            - release/**

jobs:
    distribute:
        runs-on: ubuntu-latest

        env:
            # Passed to Fastlane as ENV["..."] variables
            FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
            FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
            EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Install Firebase CLI
              run: npm install -g firebase-tools

            - name: Install Fastlane
              run: sudo gem install fastlane -NV

            - name: Configure EAS authentication
              run: |
                  mkdir -p ~/.config/eas
                  echo "{\"token\": \"${EAS_TOKEN}\"}" > ~/.config/eas/session.json

            - name: Run Android Firebase Distribution
              run: fastlane firebase_android

            - name: Run iOS Firebase Distribution
              run: fastlane firebase_ios
