name: Expo Firebase Distribution

on:
  push:
    branches:
      - develop
      - feature/**
      - release/**

jobs:
  distribute:
    runs-on: ubuntu-latest

    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # SET UP NODE
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # -----------------------------
      # INSTALL JAVASCRIPT DEPS
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # SET UP RUBY + FASTLANE
      # -----------------------------
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      # -----------------------------
      # INSTALL FIREBASE CLI
      # -----------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # -----------------------------
      # CACHE GRADLE
      # -----------------------------
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('android/build.gradle') }}

      # ----------------------------------------------------
      # VERSION BUMP (your script)
      # ----------------------------------------------------
      - name: Bump version
        run: npm run ci:bump

      # ----------------------------------------------------
      # PREBUILD (update native files)
      # ----------------------------------------------------
      - name: Expo prebuild (Android only)
        run: npx expo prebuild --platform android --no-install

      # ----------------------------------------------------
      # BUILD RELEASE APK
      # ----------------------------------------------------
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Debug APK output
        run: ls -R android/app/build/outputs

      - name: Set Android artifact path
        run: echo "ANDROID_FILE_PATH=$(find android/app/build/outputs/apk/release -name '*release*.apk' | head -n 1)" >> $GITHUB_ENV

      - name: Debug env before Fastlane
        run: echo "ANDROID_FILE_PATH=${ANDROID_FILE_PATH}"

      # -----------------------------
      # DISTRIBUTE VIA FASTLANE
      # -----------------------------
      - name: Firebase Android Distribution
        run: bundle exec fastlane firebase_android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ANDROID_FILE_PATH: ${{ env.ANDROID_FILE_PATH }}

      # # -----------------------------
      # # BUILD IOS (ONLY IF USING EXPO MANAGED)
      # # -----------------------------
      # - name: Build iOS IPA with EAS
      #   if: runner.os == 'macOS' # fallback for mac self-host or future mac runners
      #   run: |
      #       export EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}
      #         eas build --platform ios --profile preview --non-interactive

      # # -----------------------------
